<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krishna Priya S — Software Development Engineer</title>
    <meta
      name="description"
      content="Portfolio of Krishna Priya S, Software Development Engineer specializing in Full-Stack Web Applications, Applied AI Systems, 3D Clinical Visualization, and Data Analytics."
    />
    <meta property="og:title" content="Krishna Priya S — Software Development Engineer" />
    <meta
      property="og:description"
      content="Full-Stack Software Development Engineer (M.Sc. DCS, 8.65 CGPA) building scalable React, Next.js, TypeScript, Node.js, and local LLM/RAG systems."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kp-portfolio-theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-[#09090B] dark:bg-[#09090B] dark:text-[#F4F4F5] antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
